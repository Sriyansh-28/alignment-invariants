# Main experiment configuration.
#
# Every parameter that defines the study lives here. Running a variant should
# never require editing source code.
#
# CALL BUDGET PLAN (hard cap 250 live calls)
#   pilot            8 tasks x 6 conditions            =  48
#   main            27 tasks x 6 conditions            = 162
#   consistency     12 tasks x 1 repeat of stage 1     =  12
#   ablation B-alt  12 tasks x 1 alternative wording   =  12
#   ---------------------------------------------------------
#   planned total                                        234
#   reserve for retries / failures                        16
#
# The runner computes this plan before issuing any request and aborts if it
# would exceed max_api_calls. Cache hits never count against the budget.

experiment_name: "alignment-invariants-v1"
seed: 20260816

model:
  # Read from GEMINI_MODEL if set, otherwise this value. See README
  # "Free API Requirement" for how to change it.
  #
  # Was "gemini-2.5-flash" during design. Google restricted both that model and
  # gemini-2.5-flash-lite to pre-existing users, so generateContent now returns
  # 404 NOT_FOUND for new keys and the study could not run as originally
  # specified. Switched to the nearest available flash-lite successor.
  # gemini-3.5-flash-lite and gemini-flash-lite-latest were rejected as
  # substitutes: both return 400 INVALID_ARGUMENT for thinking_budget=0, which
  # is load-bearing for condition B (see the thinking_budget note below).
  name: "gemini-3.1-flash-lite"
  temperature: 0.0
  # Raised from 1024 after Pilot 2, where two responses were truncated
  # mid-reasoning and recorded as unparseable. With thinking_budget = 0 all
  # reasoning is visible output, so the limit has to leave room for it. The
  # Revision 3 families are meant to be answerable in a short reply, so this is
  # headroom against truncation, not an invitation to produce long traces.
  max_output_tokens: 3072
  # Deterministic decoding is requested so the prompt manipulation is not
  # confounded with sampling noise. The API does not guarantee determinism;
  # the consistency probe measures how well it holds in practice.
  seed: 7
  # Thinking tokens are disabled so that all reasoning the intervention can act
  # on is visible in the response text. With hidden thinking enabled the model
  # may already self-correct internally, which would confound condition B.
  # This is a real scope limit on the findings and is stated in the report.
  thinking_budget: 0
  timeout_s: 60

budget:
  max_api_calls: 250        # hard ceiling, enforced at call time
  abort_on_budget_error: true

dataset:
  # Revision 3 families (Addendum 4). The Revision 1/2 procedural puzzles
  # (arith_chain, logic_order, set_filter) were retired after two pilots at
  # 48/48: deterministic fully specified puzzles are the class where patient
  # step-by-step execution always wins, so scaling them bought truncation
  # rather than measurable error.
  families: ["false_premise", "evidence_update", "convention", "instruction_conflict"]
  difficulties: [1, 2, 3]
  # Main evaluation set: fully crossed, 3 items per (family x difficulty) cell.
  n_per_cell: 3
  eval_split: "eval"
  # Pilot uses a disjoint split so that piloting cannot contaminate the main
  # analysis if the design changes in response to what the pilot shows.
  #
  # Pilot 2 runs on its own split. The generators were revised after Pilot 1
  # (Addendum 3), so every instance differs anyway, but a distinct split name
  # keeps the two pilots separable in the cache and makes it impossible to
  # serve a Pilot 1 response as Pilot 2 data. Pilot 1 used "pilot" and its
  # results are preserved at experiments/pilot1_results.json.
  #
  # Pilot 3 runs on its own split again. Pilot 1 used "pilot", Pilot 2 used
  # "pilot2"; both are preserved under experiments/. The Revision 3 families
  # share no generator code with the retired ones, so no Pilot 1/2 response can
  # be served from cache for a Pilot 3 request.
  #
  # PRE-REGISTERED TARGET, unchanged from Pilot 2 and fixed before Pilot 3 was
  # run: baseline (stage-1) accuracy in [0.60, 0.90]. The gate's own hard limits
  # are unchanged at (0.05, 0.95); the narrower band is the design target, not a
  # gate, and no gate threshold has been edited at any point in this study.
  pilot_split: "pilot3"
  pilot_n_per_cell: 1
  # Purposive 4-task pilot sample = 24 live calls at six conditions. One item
  # from every family, spanning all three difficulty levels. Pilot 3 is sized to
  # answer "does this instrument produce errors at all", not to estimate any
  # effect: with one item per family it cannot characterise the difficulty
  # ladder, and that limit is reported rather than papered over.
  #
  # false_premise is taken at d1, which under the family's parity rule is a
  # false-premise item -- the case the family exists to measure.
  pilot_cells:
    - ["false_premise", 1]
    - ["evidence_update", 2]
    - ["convention", 3]
    - ["instruction_conflict", 3]

conditions:
  - baseline
  - reprompt_control
  - self_critique
  - verification
  - conflicting_evidence
  - preserve_pressure

probes:
  # Re-issue stage 1 with an identical request but a distinct repetition index,
  # to measure whether nominally deterministic decoding actually repeats.
  consistency:
    enabled: true
    n_tasks: 12
    repeats: 1
  # Alternative wording of condition B on a subset.
  prompt_ablation:
    enabled: true
    name: "self_critique_alt"
    n_tasks: 12

paths:
  cache_dir: "cache"
  results_dir: "experiments"
  tables_dir: "results/tables"
  figures_dir: "results/figures"

analysis:
  bootstrap_iterations: 10000
  confidence_level: 0.95
  # Holm-Bonferroni across the family of primary paired comparisons.
  multiple_comparison_correction: "holm"
